version: '3'
services:
  # 1. Nosso Banco de Dados (onde ficarão as camadas Bronze e Silver)
  postgres_clima:
    image: postgres:15
    container_name: postgres_clima
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=clima_dw
    ports:
      - "5434:5432" # Porta 5434 para não conflitar com outros projetos
    volumes:
      - postgres_clima_data:/var/lib/postgresql/data

  # 2. O Airflow (O Maestro que vai rodar nossos scripts)
  airflow:
    image: puckel/docker-airflow:1.10.9
    container_name: apache_airflow
    restart: always
    volumes:
      - ./dags:/usr/local/airflow/dags # Pasta onde ficarão nossas automações
    environment:
      - LOAD_EX=n # Não carregar exemplos pesados do Airflow
      - EXECUTOR=SequentialExecutor
    ports:
      - "8080:8080" # Porta para o painel do Airflow no navegador
    depends_on:
      - postgres_clima

volumes:
  postgres_clima_data: