name: CI Pipeline Seguro

on:
  push:
    branches: [ "main", "dev" ]

jobs:
  security-and-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências de análise
        run: pip install bandit safety

      - name: SAST - Analisar código com Bandit
        # -r: recursivo, -ll: reporta apenas problemas de média/alta severidade
        run: bandit -r src/ dags/ -ll

      - name: SCA - Verificar vulnerabilidades nas dependências
        run: safety scan -r requirements.txt --disable-optional-telemetry

      - name: Validar sintaxe
        run: |
          python -m py_compile src/*.py
          python -m py_compile dags/*.py